# This workflow will wget getrawadrman.json files each night at 0 UTC and add them to this repository.
# Files are fetched from https://demo.peer.observer/addrman/

name: demo-peer-observer

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [hal, len]
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Configure git
      run: |
        git config --local user.email "0xb10c+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "bot"
    - name: Download files
      run: |
        wget https://demo.peer.observer/addrman/${{ matrix.node }} -O getrawaddrman-${{ matrix.node }}.json.gz
        zcat getrawaddrman-${{ matrix.node }}.json.gz | jq --sort-keys > getrawaddrman-${{ matrix.node }}.json
    - name: Commit changes
      run: |
        git add getrawaddrman-${{ matrix.node }}.json
        git commit -m "Updated demo.peer.observer files: $(date)" -a -m "TIMESTAMP: $(date +%s)" || true
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
